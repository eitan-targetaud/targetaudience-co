<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>תודה! הפרטים התקבלו</title>
<meta name="description" content="תודה שמילאת את השאלון - נחזור אליך בהקדם עם הצעת מחיר מותאמת אישית.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FBF3F0;
    --card: #FFFDFC;
    --rose: #E7A2AC;
    --rose-soft: #F3C7CE;
    --rose-deep: #B85C6B;
    --rose-deeper: #8F3F4E;
    --peach: #F4DCC6;
    --lavender: #E7DCEC;
    --ink: #3B2A2E;
    --ink-soft: #7A6265;
    --line: #EFDCD9;
    --shadow: 0 20px 50px -20px rgba(184,92,107,0.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    font-family:'Heebo', sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3,.serif{
    font-family:'Frank Ruhl Libre', serif;
  }

  /* ambient glow blobs - same signature element as the quiz page */
  .blob{
    position:fixed;
    border-radius:50%;
    filter: blur(60px);
    opacity:0.55;
    z-index:0;
    pointer-events:none;
  }
  .blob-1{
    width:420px;height:420px;
    background: radial-gradient(circle at 30% 30%, var(--rose-soft), transparent 70%);
    top:-120px; right:-140px;
    animation: drift1 18s ease-in-out infinite;
  }
  .blob-2{
    width:380px;height:380px;
    background: radial-gradient(circle at 60% 40%, var(--peach), transparent 70%);
    bottom:-160px; left:-120px;
    animation: drift2 22s ease-in-out infinite;
  }
  .blob-3{
    width:300px;height:300px;
    background: radial-gradient(circle at 50% 50%, var(--lavender), transparent 70%);
    top:40%; left:50%;
    animation: drift3 26s ease-in-out infinite;
    opacity:0.35;
  }
  @keyframes drift1{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-30px, 40px) scale(1.08); }
  }
  @keyframes drift2{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(40px,-30px) scale(1.1); }
  }
  @keyframes drift3{
    0%,100%{ transform: translate(-50%,-50%) scale(1); }
    50%{ transform: translate(-45%,-55%) scale(1.15); }
  }
  @media (prefers-reduced-motion: reduce){
    .blob{animation:none !important;}
  }

  .wrap{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
  }

  .stage{
    width:100%;
    max-width:560px;
  }

  .card{
    background:var(--card);
    border-radius:28px;
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    padding:44px 32px 40px;
    position:relative;
    overflow:hidden;
  }

  .done-wrap{ text-align:center; padding:10px 0 6px; }
  .done-icon{
    width:76px;height:76px;
    border-radius:50%;
    background: linear-gradient(135deg, var(--rose-soft), var(--peach));
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 22px;
  }
  .done-title{ font-size:26px; margin:0 0 10px; font-weight:700; }
  .done-sub{ font-size:15.5px; color:var(--ink-soft); line-height:1.6; margin:0 0 6px; }

  @media (max-width:480px){
    .card{ padding:34px 20px 30px; border-radius:22px; }
    .done-title{ font-size:22px; }
  }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="wrap">
  <div class="stage">
    <div class="card">
      <div class="done-wrap">
        <div class="done-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
            <path d="M4 12.5L9.5 18L20 6" stroke="#8F3F4E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2 class="done-title">תודה! הפרטים התקבלו</h2>
        <p class="done-sub">תודה, הכל מוכן. נחזור אליך בהקדם עם הפרטים.</p>
      </div>
    </div>
  </div>
</div>

</body>
</html>
